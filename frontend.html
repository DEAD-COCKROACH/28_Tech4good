<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Authentication</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .form-card {
            background-color: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 400px;
            width: 100%;
            padding: 2.5rem;
            transition: all 0.3s ease;
        }
        .tab-button {
            transition: all 0.2s;
            font-weight: 600;
        }
        .tab-button.active {
            color: #4f46e5; 
            border-bottom: 3px solid #4f46e5;
        }
    </style>
</head>
<body class="antialiased">

    
    <div class="form-card">
        
        
        <div id="auth-tabs" class="flex border-b border-gray-200 mb-8">
            <button id="login-tab" class="tab-button px-4 py-2 mr-4 active" onclick="showForm('login')">
                Log In
            </button>
            <button id="signup-tab" class="tab-button px-4 py-2" onclick="showForm('signup')">
                Sign Up
            </button>
        </div>

    
        <form id="login-form" class="space-y-6">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Welcome Back</h2>
            
            <div>
                <label for="login-email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="login-email" required placeholder="name@example.com"
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
            </div>
            
            <div>
                <label for="login-password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••"
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
            </div>
            
            <div class="flex justify-between items-center text-sm">
                <label class="flex items-center text-gray-600">
                    <input type="checkbox" class="rounded text-indigo-600 mr-2 border-gray-300 focus:ring-indigo-500">
                    Remember me
                </label>
                
                <a href="#" class="text-indigo-600 hover:text-indigo-800 font-medium" onclick="showForm('recover'); return false;">Forgot Password?</a>
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 text-white p-3.5 rounded-xl font-semibold hover:bg-indigo-700 transition duration-200 shadow-md hover:shadow-lg">
                Sign In
            </button>
            
        </form>

        
        <form id="signup-form" class="space-y-6 hidden">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Create Account</h2>

            <div>
                <label for="signup-name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="signup-name" required placeholder="John Doe"
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
            </div>
            
            <div>
                <label for="signup-email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="signup-email" required placeholder="newuser@example.com"
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
            </div>
            
            <div>
                <label for="signup-password" class="block text-sm font-medium text-gray-700 mb-1">Choose Password</label>
                <input type="password" id="signup-password" required placeholder="••••••••"
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
            </div>
            
            <button type="submit"
                    class="w-full bg-indigo-600 text-white p-3.5 rounded-xl font-semibold hover:bg-indigo-700 transition duration-200 shadow-md hover:shadow-lg">
                Create Account
            </button>
            
        </form>
        <form id="recover-form" class="space-y-6 hidden">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Password Recovery</h2>
            
            <p class="text-sm text-gray-600">Enter your email address and we'll send you a link to reset your password.</p>

            <div>
                <label for="recover-email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="recover-email" required placeholder="name@example.com"
                       class="w-full p-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 text-white p-3.5 rounded-xl font-semibold hover:bg-indigo-700 transition duration-200 shadow-md hover:shadow-lg">
                Send Reset Link
            </button>
            
            <p class="text-center mt-4">
                <a href="#" class="text-indigo-600 hover:text-indigo-800 font-medium text-sm" onclick="showForm('login'); return false;">
                    ← Back to Log In
                </a>
            </p>
        </form>
    </div>

    <script>
        function showForm(formId) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const recoverForm = document.getElementById('recover-form'); 
            const authTabs = document.getElementById('auth-tabs'); 
            
            const loginTab = document.getElementById('login-tab');
            const signupTab = document.getElementById('signup-tab');

            
            loginForm.classList.add('hidden');
            signupForm.classList.add('hidden');
            recoverForm.classList.add('hidden');

    
            loginTab.classList.remove('active');
            signupTab.classList.remove('active');

            if (formId === 'login') {
                loginForm.classList.remove('hidden');
                loginTab.classList.add('active');
                authTabs.classList.remove('hidden'); 
            } else if (formId === 'signup') {
                signupForm.classList.remove('hidden');
                signupTab.classList.add('active');
                authTabs.classList.remove('hidden'); 
            } else if (formId === 'recover') { 
                recoverForm.classList.remove('hidden');
                authTabs.classList.add('hidden'); 
            }
        }

        
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Login form submitted.');
        });

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Sign Up form submitted.');
        });
        
        
        document.getElementById('recover-form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Password Recovery form submitted. Sending reset link...');
            
        });
    </script>
</body>
</html>
